<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UrbanWear | Payment</title>
  <link rel="stylesheet" href="payment.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">UrbanWear</div>
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a class="active" href="#">Payment</a></li>
      <li><a href="contact.html">About us</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>Secure Payment</h2>

    <form id="paymentForm">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="John Doe" required>

      <label>Email</label>
      <input type="email" id="email" 
placeholder="john@email.com
" required>

      <label>Card Number</label>
      <input type="text" id="card" placeholder="1234 5678 9012 3456" maxlength="19" required>

      <div class="row">
        <div>
          <label>Expiry</label>
          <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
        </div>

        <div>
          <label>CVV</label>
          <input type="password" id="cvv" placeholder="123" maxlength="3" required>
        </div>
      </div>

      <button type="submit">Pay Now</button>
    </form>

    <p id="message"></p>
  </div>

  <script src="payment.js"></script>
</body>
</html>
