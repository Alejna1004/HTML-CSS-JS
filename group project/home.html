<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopZone | Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css
" rel="stylesheet">

  <link rel="stylesheet" href="home.css">
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">UrbanWear</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">About us</a></li>
        <li class="nav-item"><span class="cart">🛒 <span id="cart-count">0</span></span></li>
      </ul>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Welcome to UrbanWear</h1>
    <p>Best online shopping experience</p>
    <button id="shopNow">Shop Now</button>
  </div>
</section>

<section class="container my-5">
  <form id="searchForm" class="mb-4">
    <input type="text" id="searchInput" placeholder="Search product..." required>
    <button type="submit">Search</button>
  </form>

  <div class="products" id="product-list">
    <!-- Products from JS -->
  </div>
</section>

<footer>
  <p>© 2026 ShopZone. All rights reserved.</p>
</footer>

<script src="home.js"></script>
<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js
