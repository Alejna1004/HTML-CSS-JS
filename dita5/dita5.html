<!DOCTYPE html>
<html>
    <head>
         <title>Document</title>
    </head>
    <body>
        <form>
            <fieldset>
            <label for="firstname">Firstname:</label>
            <input type="text" id="firstname" name="firstname"><br>
            
            <label for="lastname">Lastname:</label>
            <input type="text" id="lastname" name="lastname"><br>
            
            <label for="email">Email:</label>
            <input type="text" id="email" name="email"><br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="passowrd" placeholder="Write here password"><br>
            
            <label >Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br>

            <label for="hobbies">Hobbies:</label><br>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label><br>
            <input type="checkbox" id="traveling" name="hobbies" value="traveling">
            <label for="traveling">Traveling</label><br>
            <input type="checkbox" id="gaming" name="hobbies" value="gaming">
            <label for="gaming">Gaming</label><br>
            <input type="checkbox" id="swimming" name="hobbies" value="swimming">
            <label for="swimming">Swimming</label><br>

            <select name="pet" id="pet">
               <option value="dog">Dog</option>
               <option value="cat">Cat</option>
               <option value="Parrot">Parrot</option>
            </select>

            <textarea name="message" rows="18" cols="20" id=""></textarea><br>
            
            <input type="submit" id="submit" name="submit"><br>
            
        </fieldset>
        </form>
    </body>
</html>
